
name: consultancy-dev

services:
  mongodb:
    image: mongo:7.0
    container_name: consultancy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: devpassword
      MONGO_INITDB_DATABASE: consultancy_dev
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - consultancy-network

  redis:
    image: redis:7.4-alpine
    container_name: consultancy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass devredispassword
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devredispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - consultancy-network

  mongo-express:
    image: mongo-express:1.0.2
    container_name: consultancy-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpassword
      ME_CONFIG_MONGODB_URL: mongodb://admin:devpassword@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: devpassword
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - consultancy-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: consultancy-redis-commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:devredispassword"
      HTTP_USER: admin
      HTTP_PASSWORD: devpassword
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - consultancy-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

networks:
  consultancy-network:
    driver: bridge